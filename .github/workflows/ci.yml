name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-api.txt pytest httpx
      - run: pytest -q

  deploy:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - name: Publicar no Hugging Face Spaces
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          pip install huggingface_hub
          mkdir space
          cp -r Dockerfile requirements-api.txt src api models space/
          cat > space/README.md <<'EOF'
          ---
          title: Previsão de Churn
          emoji: 📉
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          API e app de previsão de churn. Código: https://github.com/${{ github.repository }}
          EOF
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.create_repo('$HF_SPACE', repo_type='space', space_sdk='docker', exist_ok=True)
          api.upload_folder(folder_path='space', repo_id='$HF_SPACE', repo_type='space',
                                commit_message='Atualiza a partir de ${{ github.sha }}')
          "
